name: Static quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: static-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Ruff and Pyright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.4"
          python-version: "3.11"
          enable-cache: true
      - name: Install locked project environment
        run: uv sync --locked --all-extras
      - name: Ruff lint
        run: uv run --locked ruff check askany test tool/keyword_utils.py tool/langdetect.py
      - name: Ruff format
        run: uv run --locked ruff format --check askany test tool/keyword_utils.py tool/langdetect.py
      - name: Pyright
        run: uv run --locked --all-extras pyright

  offline-tests:
    name: Offline pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # The repository tracks .env; offline tests must not consume local values.
      - name: Remove local .env from the job checkout
        run: rm -f .env
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.4"
          python-version: "3.11"
          enable-cache: true
      - name: Install locked project environment
        run: uv sync --locked --all-extras
      - name: Offline LightRAG unit tests
        run: >-
          uv run --locked pytest -q --disable-socket
          -m "not integration and not lightrag and not slow"
          test/test_lightrag_question_loader.py
          test/test_lightrag_merge.py
          test/test_lightrag_e2e_comparison_unit.py
